@startuml
title Timer collaboration example

skinparam linetype ortho
top to bottom direction

component "Control" as Control <<AO>>
component "◷ <b>SleepTimer</b>\nOne-shot; inactivity interval" as SleepTimer <<TIMER>>
component "◷ <b>HealthTimer</b>\nPeriodic; health-report interval" as HealthTimer <<TIMER>>

SleepTimer - -> Control
note on link
  SleepTimer -> Control
    CONSIDER_SLEEPING
end note

HealthTimer - -> Control
note on link
  HealthTimer -> Control
    HEALTH_REPORT_DUE
end note

@enduml

